[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chimerakit"
dynamic = ["version"]
description = "Python client for the Chimera partner bank API (Politics & War)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "George Long", email = "georgelongpnw@gmail.com" }]
requires-python = ">=3.9"
dependencies = ["httpx>=0.27,<1"]
keywords = ["politics and war", "pnw", "chimera", "bank", "api client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Framework :: AsyncIO",
    "Topic :: Games/Entertainment",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/GeorgeHLong/ChimeraKit"
Source = "https://github.com/GeorgeHLong/ChimeraKit"
Issues = "https://github.com/GeorgeHLong/ChimeraKit/issues"
Changelog = "https://github.com/GeorgeHLong/ChimeraKit/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["chimerakit"]

[tool.setuptools.dynamic]
version = { attr = "chimerakit.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
